<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shared trip plan | ARS Tourist Guide</title><link rel="stylesheet" href="style.css"></head><body class="live-page"><main class="live-main"><section class="live-panel"><div class="live-form-copy"><span>COLLABORATIVE TRIP</span><h2 id="title">Loading trip plan…</h2><p id="owner"></p></div><form class="live-form" id="planForm" hidden><div class="input-group"><label>Destination</label><input id="destination" required></div><div class="input-group"><label>Days</label><input id="days" type="number" min="1" required></div><div class="input-group"><label>Travellers</label><input id="travellers" type="number" min="1" required></div><div class="input-group"><label>Budget (INR)</label><input id="budget" type="number" min="0" required></div><div class="input-group"><label>Notes / description</label><textarea id="description" rows="4"></textarea></div><button class="generate-btn">Save shared changes</button><p id="message"></p></form></section></main><script src="shared-plan.js"></script></body></html>
