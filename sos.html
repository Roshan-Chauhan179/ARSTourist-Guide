<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emergency SOS | ARS</title><link rel="stylesheet" href="style.css"></head><body class="live-page"><main class="live-main"><section class="live-panel"><div class="live-form-copy"><span>EMERGENCY SOS</span><h2>Share live location</h2><p>In immediate danger, call 112 first. Location sharing needs your browser permission and an internet/SMS-capable app.</p><a class="action-btn emergency-call" href="tel:112">Call 112 now</a></div><div class="live-form sos-actions"><form id="contactForm"><div class="input-group"><label for="contactName">Contact name</label><input id="contactName" required></div><div class="input-group"><label for="contactPhone">Phone with country code</label><input id="contactPhone" placeholder="+919876543210" required></div><button class="generate-btn" type="submit">Save emergency contact</button></form><div id="contacts" aria-live="polite"></div><button class="generate-btn sos-share-button" id="sosButton" type="button">🆘 Share my live location</button><p id="status" aria-live="polite"></p></div></section></main><script src="sos.js"></script></body></html>
