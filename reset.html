<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password | ARS Tourist Guide</title><link rel="stylesheet" href="style.css"></head><body class="live-page"><main class="live-main"><section class="live-panel"><div class="live-form-copy"><span>ACCOUNT SECURITY</span><h2>Choose a new password</h2><p>Your reset link expires after 30 minutes.</p></div><form class="live-form" id="resetForm"><div class="input-group"><label>New password</label><input id="password" type="password" minlength="8" required></div><div class="input-group"><label>Confirm password</label><input id="confirmPassword" type="password" minlength="8" required></div><button class="generate-btn">Reset password</button><p id="message"></p></form></section></main><script>document.getElementById('resetForm').addEventListener('submit',async e=>{e.preventDefault();const message=document.getElementById('message'),token=new URLSearchParams(location.search).get('token'),password=document.getElementById('password').value;if(password!==document.getElementById('confirmPassword').value){message.textContent='Passwords do not match.';return}const r=await fetch('/api/auth/password-reset/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password})});const data=await r.json();message.textContent=data.message||data.error;if(r.ok)setTimeout(()=>location.href='/index.HTML',1200)})</script></body></html>
