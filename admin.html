<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Dashboard | ARS Tourist Guide</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="operations.css"></head><body><header class="ops-nav"><a href="index.HTML">🌍 ARS Tourist Guide</a><nav><a href="packages.html">Packages</a><a href="index.HTML">Home</a></nav></header><main class="ops-main"><section class="ops-hero"><p>OPERATIONS</p><h1>Admin dashboard</h1><span>Manage packages, bookings, customers and your media gallery.</span></section><p id="adminNotice" class="ops-notice"></p><section id="summary" class="summary-grid"></section><section class="admin-grid"><article class="admin-panel"><h2>Add a tour package</h2><form id="packageForm" class="admin-form"><input name="title" placeholder="Package title" required><input name="destination" placeholder="Destination" required><input name="days" type="number" min="1" placeholder="Days" required><input name="price" type="number" min="1" placeholder="Price per person (INR)" required><input name="seats" type="number" min="1" placeholder="Available seats" required><input name="photoUrl" type="url" placeholder="Public photo URL"><textarea name="inclusions" placeholder="Inclusions, one per line: Hotel&#10;Breakfast&#10;Airport transfer" required></textarea><button class="ops-primary">Add package</button></form></article><article class="admin-panel"><h2>Packages</h2><div id="adminPackages" class="data-list"></div></article><article class="admin-panel"><h2>Bookings & payments</h2><div id="adminBookings" class="data-list"></div></article><article class="admin-panel"><h2>Users</h2><div id="adminUsers" class="data-list"></div></article><article class="admin-panel"><h2>Add gallery media</h2><form id="galleryForm" class="admin-form"><input name="title" placeholder="Title" required><input name="mediaUrl" type="url" placeholder="Public image or video URL" required><select name="mediaType"><option value="photo">Photo</option><option value="video">Video</option></select><button class="ops-primary">Add gallery item</button></form></article><article class="admin-panel"><h2>Gallery</h2><div id="adminGallery" class="data-list"></div></article></section></main><script src="admin.js"></script></body></html>
