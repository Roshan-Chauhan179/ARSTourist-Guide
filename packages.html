<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Tour Packages | ARS Tourist Guide</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="operations.css"></head>
<body><header class="ops-nav"><a href="index.HTML">🌍 ARS Tourist Guide</a><nav><a href="index.HTML">Home</a><a href="admin.html">Admin dashboard</a></nav></header>
<main class="ops-main"><section class="ops-hero"><p>CURATED TOURS</p><h1>Book a complete holiday</h1><span>Transparent package inclusions, traveller count, and secure online checkout.</span></section><section class="package-filters" aria-label="Filter tour packages"><label>Search<input id="packageSearch" type="search" placeholder="Destination or package"></label><label>Budget<select id="packageBudget"><option value="">Any budget</option><option value="50000">Up to ₹50,000</option><option value="80000">Up to ₹80,000</option><option value="120000">Up to ₹1,20,000</option></select></label><label>Duration<select id="packageDays"><option value="">Any duration</option><option value="3">Up to 3 days</option><option value="5">Up to 5 days</option><option value="7">Up to 7 days</option></select></label><label>Travel style<select id="packageStyle"><option value="">All styles</option><option value="Adventure">Adventure</option><option value="Family">Family</option><option value="Honeymoon">Honeymoon</option><option value="Budget">Budget</option></select></label><label>Currency<select id="packageCurrency"><option value="INR">INR ₹</option><option value="USD">USD $</option><option value="EUR">EUR €</option></select></label></section><p id="packageNotice" class="ops-notice"></p><section id="packageGrid" class="package-grid" aria-live="polite"><p>Loading packages…</p></section><section id="bookingPanel" class="booking-panel" hidden><button class="ops-close" onclick="closeBooking()">×</button><h2 id="bookingTitle">Book package</h2><form onsubmit="createBooking(event)"><label>Number of travellers<input id="bookingTravellers" type="number" min="1" max="9" value="1" required></label><label>Phone for SMS confirmation (optional)<input id="bookingPhone" type="tel" placeholder="+919876543210"></label><p id="bookingTotal"></p><button class="ops-primary" type="submit">Continue to secure payment</button></form><p class="ops-muted">UPI, cards and EMI are provided through Razorpay after merchant credentials are enabled.</p></section></main><script src="translate.js"></script><script src="packages.js"></script></body></html>
